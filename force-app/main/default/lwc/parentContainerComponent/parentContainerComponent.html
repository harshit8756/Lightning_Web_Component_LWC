<template>
    Parent Container Component <br>
    Did I find any products? {productsFound}
    <br>

    <!-- this is the way that we have to call the component inside the another component. -->
    {productList}
    <br>
    <!-- Conditional rendering in LWC is done using the if:true and if:false directives. The if:true directive renders the template if the condition is true, while the if:false directive renders the template if the condition is false. -->
    <template for:each={productList} for:item="product">
        <div key = {product.id}>
            <c-child-component  product-id = {product.id} product-name = {product.name} product-rating = {product.rating}></c-child-component>
        </div>
        
    </template>

    <!-- Calling another component inside the parent component
    this is the way that we have to call the component inside the another component. -->


    <!-- now we are trying to call the method from the child component to the parent component.
    so we can use the event to call the method from the child component to the parent component.
    working scenario: when we call this method on the parent component,it will be called from the child component and it will be called from the parent component. -->
    <template lwc:if = {parentCalled}>
        Show that the method is called from the container component!
        It has not been called from the chlid component.

    </template>>
    

</template>
