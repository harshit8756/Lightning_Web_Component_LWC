<template>
    <lightning-card title="Edit Record with Custom Layout via lightning-record-edit-form">
        <div class="slds-m-around_medium">
            <!-- to be able to edit a record with custom fields/layout -->
            <lightning-record-edit-form record-id = {recordId} object-api-name= {objectApiName} onsuccess= {handleFormSuccess}>
                <lightning-messages></lightning-messages>
                <div class="slds-grid slds-wrap">
                    <div class="slds-col slds-size_1-of-2"><lightning-input-field field-name="CaseNumber"></lightning-input-field></div>
                    <div class="slds-col slds-size_1-of-2"><lightning-input-field field-name="Origin"></lightning-input-field></div>
                    <div class="slds-col slds-size_1-of-2"><lightning-input-field field-name="Type"></lightning-input-field></div>
                    <div class="slds-col slds-size_1-of-2"><lightning-input-field field-name="Region"></lightning-input-field></div>
                    <div class="slds-col slds-size_1-of-2"><lightning-input-field field-name="Subject"></lightning-input-field></div>
                    <div class="slds-col slds-size_1-of-2"><lightning-input-field field-name="Status"></lightning-input-field></div>
                    <div class="slds-col slds-size_2-of-2"><lightning-input-field field-name="SLAViolation__c" required></lightning-input-field></div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-button class="slds-m-right_small" type="submit" label="save" variant="brand"></lightning-button>
                        <lightning-button type="reset" label="Reset" variant="outline"></lightning-button>
                    </div>
                </div>
            </lightning-record-edit-form>
        </div>
    </lightning-card>
</template>
