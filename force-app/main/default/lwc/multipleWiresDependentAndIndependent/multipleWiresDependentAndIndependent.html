<!-- Use case : On one LWC , I want to display Accounts and Contacts . Both data sets are independent -->
<template>
    <lightning-card title="Multiple Wires in LWC Dependent and Independent">
        <h2>Accounts</h2>
        <template for:each={getAccountList} for:item="accountList">
            <div key = {accountList.id}>
                {accountList.Name} - {accountList.Industry}
            </div>
        </template>
        <br>

        <h2>Contacts</h2>
        <template for:each={getContactList} for:item="contactList">
            <div key = {contactList.id}>
                {contactList.Name} - {contactList.Email}
            </div>

        </template>
    </lightning-card>
</template>
