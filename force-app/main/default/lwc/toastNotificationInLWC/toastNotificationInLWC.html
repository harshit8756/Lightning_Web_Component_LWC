<!-- Use Case: Create a Task
User enters a Task Subject and clicks Create Task.
If the Task is created → show Success Toast.
If something goes wrong → show Error Toast. -->

<template>
    <lightning-card title="Toast Notification [Create a Task] ">
        <div class="slds-m-around_medium">
            <lightning-input lable = "Task Subject" onchange={handleSubjectChange}></lightning-input>
            <lightning-button label="Create Task" variant="brand" onclick={handleCreateTask}></lightning-button>

        </div>
    </lightning-card>
</template>
