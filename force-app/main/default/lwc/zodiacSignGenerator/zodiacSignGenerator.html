<template>
    <lightning-card title="Zodiac Sign Generator" icon-name="custom:custom63">
        <lightning-input class="slds-m-around_medium" value={userName} onchange={handleNameChange} type="text"
            label="Enter your name"></lightning-input>
        <lightning-input class="slds-m-around_medium" value={userBirthDate} onchange={handleBirthDateChange} type="date"
            label="Enter your birth date"></lightning-input>
        <lightning-button variant="success" label="Submit" onclick={handleSubmitButton} title="Successful action"
            class=" slds-align_absolute-center slds-p-around_medium"></lightning-button>


    </lightning-card>

    {userProfile.sign}
    {userProfile.trait}
    {userProfile.emoji}

</template>
