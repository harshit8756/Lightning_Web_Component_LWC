<template>
    <!-- My use case : I want the user to input the subject string , once they do it , I want them to click a button .
    When they click a button I want to call Apex Method. After apex method return data, I want to display it on a table -->
    <lightning-card title="Search Task By Subject with Imperative Method through Apex Controller">
        <div class="slds-m-around_medium">
            <lightning-input label="Enter Subject" value = {subjectTask} onchange= {handleSubjectChange}></lightning-input>
            <lightning-button label="Search" variant="brand" onclick= {handleSearch} class="slds-m-top_small"></lightning-button>
        </div>

        <template lwc:if= {taskList.length}>
            <div class="slds-m-around_medium">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr>
                            <th>Subject</th>
                            <th>Status</th>
                            <th>Priority</th>
                            <th>Description</th>
                        </tr>
                    </thead>

                    <tbody>
                        <template for:each={taskList} for:item="taskIterator">
                            <tr key = {taskIterator.Id}>
                                <td>{taskIterator.Subject}</td>
                                <td>{taskIterator.Status}</td>
                                <td>{taskIterator.Priority}</td>
                                <td>{taskIterator.Description}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>

        <template lwc:else>
            <p class="slds-m-around_medium"> No Task Found</p>
        </template>
    </lightning-card>
</template>
